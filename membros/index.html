<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#2a0908">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Doce Natal">
  <meta name="application-name" content="Doce Natal">
  <title>Área de Membros | Kit Doce Natal</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="../assets/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <script src="../assets/js/kit.js"></script>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="membros.css">
  <script defer src="data/receitas.js"></script>
  <script defer src="data/conteudo.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true"><span class="logo-spark">🍪</span><span class="splash-dots"><i></i><i></i><i></i></span></div>
  <noscript><p class="nojs">Ative o JavaScript do navegador para usar a área de membros.</p></noscript>
  <!-- ================= LOGIN ================= -->
  <div class="login" id="login" hidden>
    <div class="login-card">
      <a class="logo" href="../"><span class="logo-spark" aria-hidden="true">🍪</span><span class="logo-word"><em>Doce</em><strong>NATAL</strong></span></a>
      <h1>Área de <em>Membros</em></h1>
      <p>Entre com o e-mail da compra e o código de acesso que você recebeu.</p>
      <form id="login-form" novalidate>
        <label class="field">E-mail da compra<input id="lg-email" type="email" autocomplete="email" required placeholder="voce@email.com"></label>
        <label class="field" id="lg-codigo-wrap">Código de acesso<input id="lg-codigo" autocomplete="one-time-code" placeholder="Está no e-mail de boas-vindas"></label>
        <p class="lg-erro" id="lg-erro" role="alert"></p>
        <button class="btn btn-block btn-lg" type="submit">ENTRAR NO KIT →</button>
      </form>
      <p class="hint">Não encontrou o e-mail? Olhe na caixa de spam ou promoções.</p>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div class="app" id="app" hidden>
    <aside class="side" aria-label="Menu da área de membros">
      <a class="logo" href="#/inicio"><span class="logo-spark" aria-hidden="true">🍪</span><span class="logo-word"><em>Doce</em><strong>NATAL</strong></span></a>
      <nav id="side-nav"></nav>
      <p class="side-foot">Kit Doce Natal · acesso vitalício</p>
    </aside>
    <div class="side-backdrop" id="side-backdrop"></div>
    <div class="main">
      <header class="topnav">
        <a class="logo" href="#/inicio"><span class="logo-spark" aria-hidden="true">🍪</span><span class="logo-word"><em>Doce</em><strong>NATAL</strong></span></a>
        <a class="top-user" href="#/perfil">👤 <span id="top-user">Meu perfil</span></a>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
    <nav class="bottomnav" id="bottomnav" aria-label="Atalhos"></nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
