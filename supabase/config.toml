# Configuração do projeto Supabase do Natalê (usada pela CLI: npx supabase ...)
# Os SEGREDOS não ficam aqui: use "npx supabase secrets set" (veja BANCO-DE-DADOS.md).
project_id = "natale"

[auth]
site_url = "https://dimitrifergus.github.io/kit-doce-natal/membros/"
additional_redirect_urls = ["https://dimitrifergus.github.io/kit-doce-natal/membros/", "http://localhost:5500/membros/"]
# ninguém cria conta sozinho: só quem comprou (o webhook convida)
enable_signup = false
minimum_password_length = 8
password_requirements = "letters_digits"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_expiry = 3600

[auth.email.template.invite]
subject = "Natalê: crie a sua senha da área de membros"
content_path = "./supabase/templates/convite.html"

[auth.email.template.recovery]
subject = "Natalê: crie a sua nova senha"
content_path = "./supabase/templates/recuperar-senha.html"

[functions.compra-webhook]
# a Kiwify/Hotmart não mandam login do Supabase; quem protege é a assinatura/hottok (WEBHOOK_SEGREDO)
verify_jwt = false
